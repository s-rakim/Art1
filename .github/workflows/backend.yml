name: backend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements*.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/search/go.mod
          cache-dependency-path: backend/search/go.sum
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client
          pip install -r api/requirements-dev.txt ruff==0.17.6
      - name: Lint
        run: ruff check api/app --select F,E9,B --ignore B008
      - name: API tests
        working-directory: backend/api
        env:
          TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
        run: python -m pytest -q
      - name: OpenAPI spec is up to date
        working-directory: backend/api
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgres://unused@localhost/unused
          SUPABASE_JWT_SECRET: unused
        run: |
          python -m app.cli export-openapi > /tmp/openapi.json
          diff -u ../openapi.json /tmp/openapi.json || (echo "Run: python -m app.cli export-openapi > ../openapi.json" && exit 1)
      - name: Search tests
        working-directory: backend/search
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, search]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bazaar-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          # Oracle's Ampere A1 machines are arm64.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
