# Frontend service, meant to be merged with the backend's compose file:
#   docker compose -f compose.yml -f frontend/compose.frontend.yml up -d --build
# Put a TLS-terminating proxy (Caddy, Nginx, Traefik) in front of port 3000.
services:
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL, e.g. https://shop.example.com/api/v1}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
        NEXT_PUBLIC_STORE_NAME: ${STORE_NAME:-Stallrow}
        NEXT_PUBLIC_DEMO_DATA: "off"
        NEXT_PUBLIC_MAP_CENTER: ${MAP_CENTER:-30.2672,-97.7431}
    environment:
      # Server components reach the API over the internal network.
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://api:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
