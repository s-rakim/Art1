{% load bazaar %}{% for m in messages %}<div class="toast note {% if m.level_tag == 'error' %}note-error{% elif m.level_tag == 'success' %}note-success{% elif m.level_tag == 'warning' %}note-warning{% else %}note-info{% endif %}" role="{% if m.level_tag == 'error' %}alert{% else %}status{% endif %}">{% if m.level_tag == 'error' %}{% icon "alert" %}{% elif m.level_tag == 'success' %}{% icon "check" %}{% else %}{% icon "information" %}{% endif %}<span>{{ m }}</span><button type="button" aria-label="Dismiss">{% icon "close" 18 %}</button></div>{% endfor %}
